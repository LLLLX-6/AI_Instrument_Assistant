[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-instrument-assistant"
version = "0.2.0.dev0"
description = "Contract-first AI and electronic instrument integration platform"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "websockets==17.0.1",
]

[project.optional-dependencies]
hardware = [
    "PyVISA==1.16.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
